plugins {
    id 'java'
    id 'application'
    id 'com.zeroc.slice-tools' version '3.8.+' 
}

group = 'com.apexstore'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.zeroc:ice:3.8.+'
    implementation 'org.postgresql:postgresql:42.7.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.apexstore.processor.ProcessorMain'
}

task runProcessor(type: JavaExec) {
    group = "Execution"
    description = "Ejecuta el servidor de PaymentProcessor (Puerto 10001)"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.apexstore.processor.ProcessorMain'
}

task runCheckout(type: JavaExec) {
    group = "Execution"
    description = "Ejecuta el servicio de CheckoutService"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.apexstore.checkout.CheckoutMain'
}